<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slovenian Genetic Atlas</title>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Load styles via <link> (render-blocking) instead of through main.js so
         the first paint isn't FOUC. Order matches the previous import chain. -->
    <link rel="stylesheet" href="/src/style/srd-tokens.css">
    <link rel="stylesheet" href="/src/style/srd.css">
    <link rel="stylesheet" href="/src/style/style.css">

    <script type="module" src="/src/main.js"></script>
</head>
<body>

    <!-- ========================================================
         Unified SRD header (shared with rodoslovje/genealogical-index)
         ID `navbar` retained for JS (checkNavOverflow, etc.)
         ======================================================== -->
    <nav id="navbar" class="srd-navbar">
        <a href="#" class="srd-brand" onclick="resetApp(event)" aria-label="Slovenski genetski atlas">
            <img src="/srd-logo-transparent.png" alt="SRD" class="srd-brand-mark">
            <span class="srd-brand-title">
                <span class="app" data-i18n="brand">Slovenski genetski atlas</span>
                <span class="org" data-i18n="infoSloGenSoc">Slovensko rodoslovno društvo</span>
            </span>
        </a>

        <span class="srd-nav-sep" aria-hidden="true"></span>

        <div class="srd-nav-tabs desktop-nav">
            <a href="#map"   class="nav-route" id="link-map"   data-i18n="map">Map</a>
            <a href="#ydna"  class="nav-route" id="link-ydna"  data-i18n="ydna">Y-DNA</a>
            <a href="#mtdna" class="nav-route" id="link-mtdna" data-i18n="mtdna">mtDNA</a>
        </div>

        <div class="srd-nav-right">
            <div class="lang-selector" style="position: relative;">
                <button class="srd-lang-btn" id="lang-btn" onclick="toggleLangMenu(event)">
                    <img src="https://flagcdn.com/w20/gb.png" id="lang-btn-flag" alt="Flag">
                    <span id="lang-btn-text">EN</span>
                </button>
                <div class="srd-lang-menu" id="lang-menu"></div>
            </div>

            <button class="srd-icon-btn srd-nav-hamburger-wrap" onclick="toggleSidebar()" aria-label="Toggle sidebar">
                <span class="srd-hamburger"><span></span></span>
            </button>
        </div>
    </nav>

    <!-- ======= View container (router target) ======= -->
    <div id="view-container">
        <div id="view-map"   class="page-view"><div id="map-container"        style="width:100%;height:100%;z-index:1;"></div></div>
        <div id="view-ydna"  class="page-view"><div id="tree-container-ydna"  style="width:100%;height:100%;position:relative;overflow:visible;"></div></div>
        <div id="view-mtdna" class="page-view"><div id="tree-container-mtdna" style="width:100%;height:100%;position:relative;overflow:visible;"></div></div>
    </div>

    <!-- ======= Sidebar ======= -->
    <aside id="sidebar" class="srd-sidebar">

        <!-- Mobile-only mirror of the top-nav routes -->
        <div class="srd-sidebar-section mobile-nav-section">
            <h4 class="srd-sidebar-title" data-i18n="navTitle">Navigation</h4>
            <div class="nav-list-mobile">
                <a href="#map"   class="nav-route" onclick="toggleSidebar()" data-i18n="map">Map</a>
                <a href="#ydna"  class="nav-route" onclick="toggleSidebar()" data-i18n="ydna">Y-DNA</a>
                <a href="#mtdna" class="nav-route" onclick="toggleSidebar()" data-i18n="mtdna">mtDNA</a>
            </div>
        </div>

        <div class="srd-sidebar-section">
            <h4 class="srd-sidebar-title" data-i18n="searchTitle">Search</h4>
            <div class="search-wrap">
                <input type="text"
                       class="srd-input"
                       id="search-input"
                       data-i18n-placeholder="searchPlaceholder"
                       placeholder="Surname, ancestor, kit..."
                       autocomplete="off">
                <span id="search-counter"></span>
                <span id="search-clear">✕</span>
            </div>
        </div>

        <div id="map-options" style="display: none;">
            <div class="srd-sidebar-section">
                <label class="passthrough-item" style="margin-top: 0;">
                    <input type="checkbox" id="chk-show-labels">
                    <span data-i18n="showLabels">Show labels</span>
                </label>
            </div>
        </div>

        <div id="lineage-controls-ydna" style="display: none;">
            <div class="srd-sidebar-section">
                <h4 class="srd-sidebar-title" data-i18n="filterTitleYdna">Lineage (Y-DNA)</h4>
                <button class="select-all-btn" id="toggle-all-ydna" data-i18n="selectAll">Select All</button>
                <div id="lineage-count-ydna"></div>
                <div id="group-list-ydna"></div>
            </div>
        </div>

        <div id="lineage-controls-mtdna" style="display: none;">
            <div class="srd-sidebar-section">
                <h4 class="srd-sidebar-title" data-i18n="filterTitleMtdna">Lineage (mtDNA)</h4>
                <button class="select-all-btn" id="toggle-all-mtdna" data-i18n="selectAll">Select All</button>
                <div id="lineage-count-mtdna"></div>
                <div id="group-list-mtdna"></div>
            </div>
        </div>

        <div id="tree-options" style="display: none;">
            <div class="srd-sidebar-section">
                <label class="passthrough-item" style="margin-top: 0;">
                    <input type="checkbox" id="chk-show-all-major">
                    <span data-i18n="showAllMajorGroups">Show all major lineages</span>
                </label>
                <label class="passthrough-item" id="passthrough-container" style="margin-top: 10px;">
                    <input type="checkbox" id="chk-passthrough">
                    <span data-i18n="showPassthrough">Show all SNPs</span>
                </label>
                <label class="passthrough-item" style="margin-top: 10px;">
                    <input type="checkbox" id="chk-show-only-lineages">
                    <span data-i18n="showOnlyLineages">Show only lineages</span>
                </label>
            </div>
        </div>

        <div id="ydna-eras" style="display: none;">
            <div class="srd-sidebar-section">
                <h4 class="srd-sidebar-title" data-i18n="eraTitle">Eras</h4>
                <div id="era-list"></div>
            </div>
        </div>
    </aside>

    <!-- ======= Floating action buttons ======= -->
    <div id="floating-buttons">
        <div id="info-widget">
            <button id="info-btn"
                    class="srd-fab srd-fab--info"
                    aria-label="Info"
                    onclick="toggleInfoBubble()"
                    data-i18n-title="infoButton">i</button>

            <div id="info-bubble" class="srd-popover">
                <div id="info-text-container"></div>
                <div class="info-content">
                    <a href="https://rodoslovje.si/" target="_blank" rel="noopener noreferrer">
                        <img src="/srd-logo-transparent.png" alt="SRD Logo">
                    </a>
                    <ul>
                        <li><a href="https://rodoslovje.si/slovenska-dnk" target="_blank" rel="noopener noreferrer" data-i18n="infoSloGenHeritage">Slovenian Genetic Heritage</a></li>
                        <li><a href="https://www.familytreedna.com/groups/slovenianorigin/about" target="_blank" rel="noopener noreferrer" data-i18n="infoDataFtdna">FamilyTreeDNA</a></li>
                        <li><a href="https://rodoslovje.si/" target="_blank" rel="noopener noreferrer" data-i18n="infoSloGenSoc">Slovenian Genealogical Society</a></li>
                        <li id="version-info"></li>
                        <li id="data-info"></li>
                    </ul>
                </div>
                <div style="text-align: right; margin-top: 8px;">
                    <a href="https://github.com/rodoslovje/genetic-atlas" target="_blank" rel="noopener noreferrer" class="info-github-link">GitHub</a>
                </div>
            </div>
        </div>

        <button id="export-btn" class="srd-fab" aria-label="Export View" onclick="exportView(event)" data-i18n-title="exportTree">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </button>

        <button id="reset-btn" class="srd-fab" aria-label="Reset View" onclick="resetView(event)" data-i18n-title="resetView">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="22" y1="12" x2="18" y2="12"></line>
                <line x1="6"  y1="12" x2="2"  y2="12"></line>
                <line x1="12" y1="6"  x2="12" y2="2"></line>
                <line x1="12" y1="22" x2="12" y2="18"></line>
            </svg>
        </button>
    </div>

    <div id="attribution-overlay" data-i18n-html="attributionHtml"></div>

    <div id="loading-overlay" class="srd-loading">
        <div class="srd-spinner"></div>
        <div data-i18n="exporting">Exporting...</div>
    </div>

</body>
</html>
